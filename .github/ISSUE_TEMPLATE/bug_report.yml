name: Bug report
description: Report incorrect RTL/LTR rendering or another extension problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: markdown
    attributes:
      label: Minimal Markdown sample
      description: Remove private information and paste the smallest example that reproduces the problem.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
